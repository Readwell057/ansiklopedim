<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ansiklopedim</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3A5F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --paper:#F5F2E8;
    --card:#FFFFFF;
    --ink:#241F1A;
    --ink-soft:#75695A;
    --line:#DED4BE;
    --navy:#1F3A5F;
    --navy-dark:#162A45;
    --gold:#B08D3E;
    --danger:#A23B3B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.serif{ font-family:Georgia,"Times New Roman",serif; margin:0; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input,select,textarea{ font-family:inherit; font-size:15px; }
  #app{ max-width:760px; margin:0 auto; min-height:100vh; padding-bottom:30px; }
  .screen{ display:none; }
  .screen.active{ display:block; }

  /* Masthead */
  .masthead{
    background:var(--navy); color:#F5EFE0;
    padding:22px 18px; text-align:center;
    position:sticky; top:0; z-index:20;
  }
  .masthead h1{ font-size:26px; letter-spacing:0.3px; }
  .masthead .sub{ font-size:12px; color:#C9BFA0; margin-top:3px; }
  .save-btn{
    position:absolute; top:20px; right:16px; background:rgba(255,255,255,0.12); color:#F5EFE0;
    font-size:13px; font-weight:700; padding:8px 14px; border-radius:20px; transition:background 0.2s;
  }
  .save-btn.saved{ background:#3F8F5C; }
  .search-bar{
    padding:14px 16px 6px; display:flex; gap:8px;
  }
  .search-bar input{
    flex:1; padding:11px 14px; border-radius:22px; border:1px solid var(--line); background:var(--card);
  }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding:10px 16px 4px; }
  .chip{
    flex-shrink:0; padding:6px 14px; border-radius:16px; font-size:13px; font-weight:600;
    background:var(--card); border:1px solid var(--line); color:var(--ink-soft); white-space:nowrap;
  }
  .chip.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

  .facet-filters{ padding:6px 16px 4px; }
  .facet-group{ margin-bottom:10px; }
  .facet-title{ font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .facet-options{ display:flex; flex-wrap:wrap; gap:10px; }
  .facet-check{
    display:flex; align-items:center; gap:5px; font-size:13px; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:5px 10px 5px 8px;
  }
  .facet-check input{ width:15px; height:15px; }

  .toolbar-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 16px 2px; flex-wrap:wrap;
  }
  .sort-group{ display:flex; gap:6px; }
  .pill-btn.small{ font-size:12px; padding:6px 11px; }

  .backup-row{ display:flex; gap:8px; justify-content:center; padding:10px 16px 26px; }

  /* Entry grid on home */
  .entry-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px 16px 80px;
  }
  .entry-card{
    background:var(--card); border-radius:10px; overflow:hidden;
    box-shadow:0 2px 8px rgba(36,31,26,0.1); display:flex; flex-direction:column;
  }
  .entry-card .thumb{
    height:90px; display:flex; align-items:center; justify-content:center; font-size:34px; color:#fff;
    background-size:cover; background-position:center;
  }
  .entry-card .info{ padding:10px 12px; }
  .entry-card .cat-badge{
    font-size:10px; font-weight:700; color:#fff; padding:2px 8px; border-radius:10px; display:inline-block; margin-bottom:6px;
  }
  .entry-card .etitle{ font-family:Georgia,serif; font-weight:700; font-size:15px; line-height:1.3; }

  .empty-state{ padding:60px 26px; text-align:center; color:var(--ink-soft); }
  .empty-state .big{ font-size:38px; margin-bottom:10px; }

  .fab{
    position:fixed; bottom:22px; right:22px; width:58px; height:58px; border-radius:50%;
    background:var(--navy); color:#fff; font-size:28px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,0.3); z-index:30;
  }

  /* Topbar generic */
  .topbar{
    display:flex; align-items:center; gap:10px; padding:14px 16px;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper); z-index:20;
  }
  .back-btn{
    width:36px; height:36px; border-radius:50%; background:var(--card); box-shadow:0 2px 6px rgba(0,0,0,0.1);
    display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
  }
  .topbar h2{ font-size:18px; flex:1; }
  .pill-btn{
    font-size:13px; font-weight:700; border-radius:18px; padding:7px 14px; border:1px solid var(--line); background:var(--card);
  }
  .pill-btn.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

  /* New entry: category picker */
  .cat-picker{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding:18px 16px; }
  .cat-btn{
    background:var(--card); border-radius:10px; padding:16px 8px; display:flex; flex-direction:column; align-items:center; gap:6px;
    box-shadow:0 2px 6px rgba(0,0,0,0.08); border:2px solid transparent; font-size:12px; font-weight:700; text-align:center;
  }
  .cat-btn .ic{ font-size:24px; }
  .cat-btn.selected{ border-color:var(--navy); background:#EEF1F6; }

  .form-section{ padding:8px 16px 20px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type=text], .field select{
    width:100%; padding:11px; border:1px solid var(--line); border-radius:8px; background:var(--card);
  }
  .primary-btn{
    width:100%; padding:14px; border-radius:10px; background:var(--navy); color:#fff; font-weight:700; font-size:15px; margin-top:6px;
  }

  /* Entry screen */
  .cover-wrap{
    height:200px; background:var(--card); display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:14px; position:relative; background-size:cover; background-position:center; overflow:hidden;
  }
  .cover-wrap .cover-edit-btn{
    position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.55); color:#fff; padding:8px 12px; border-radius:20px; font-size:13px; font-weight:600;
  }
  .entry-header{ padding:18px 18px 10px; }
  .cat-tag-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .cat-tag{ font-size:11px; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; }
  .title-el{
    font-family:Georgia,serif; font-weight:700; outline:none; word-break:break-word;
  }
  .title-el[contenteditable=true]{ border-bottom:1px dashed var(--line); padding-bottom:4px; }

  .title-style-row{
    display:flex; gap:8px; padding:8px 18px; flex-wrap:wrap; background:#EFEAD9; margin:0 0 8px;
  }
  .title-style-row select, .title-style-row input[type=color]{
    border:1px solid var(--line); border-radius:6px; padding:5px; background:#fff; font-size:12px;
  }

  /* Infobox */
  .infobox{
    margin:0 18px 18px; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden;
  }
  .infobox-head{ background:var(--navy); color:#fff; padding:10px 14px; font-weight:700; font-size:13px; }
  .infobox-row{
    display:flex; padding:9px 14px; border-top:1px solid var(--line); font-size:13px; gap:8px; align-items:center;
  }
  .infobox-row .k{ width:38%; color:var(--ink-soft); font-weight:600; flex-shrink:0; }
  .infobox-row .v{ flex:1; }
  .infobox-row select, .infobox-row input[type=text]{
    width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px;
  }

  /* Content toolbar */
  .toolbar{
    display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px; background:var(--card);
    border-top:1px solid var(--line); border-bottom:1px solid var(--line); position:sticky; top:54px; z-index:15;
  }
  .toolbar select, .toolbar input[type=color]{
    border:1px solid var(--line); border-radius:6px; padding:6px; background:#fff; font-size:13px;
  }
  .toolbar button{
    border:1px solid var(--line); border-radius:6px; padding:6px 10px; background:#fff; font-size:13px;
  }
  .content-body{
    padding:16px 18px 60px; line-height:1.65; font-size:16px; outline:none; min-height:200px;
  }
  .content-body:empty:before{ content: attr(data-placeholder); color:var(--ink-soft); }
  .content-body h2{ font-family:Georgia,serif; font-size:23px; margin:18px 0 8px; }
  .content-body h3{ font-family:Georgia,serif; font-size:19px; margin:14px 0 6px; }
  .content-body img.body-img{ max-width:100%; border-radius:6px; }
  .content-body a.wiki-link{ color:var(--navy); font-weight:700; text-decoration:underline; text-decoration-style:dotted; }
  .content-body a.wiki-link.broken{ color:var(--danger); text-decoration-style:dashed; }

  .img-float-toolbar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:16px;
    background:var(--navy-dark); color:#fff; border-radius:30px; padding:8px 10px; display:none; gap:6px;
    z-index:40; box-shadow:0 6px 18px rgba(0,0,0,0.35); max-width:94%; overflow-x:auto;
  }
  .img-float-toolbar.active{ display:flex; }
  .img-float-toolbar button{ background:rgba(255,255,255,0.12); color:#fff; padding:7px 11px; border-radius:16px; font-size:12px; white-space:nowrap; }
  .img-float-toolbar button.danger{ background:var(--danger); }

  /* Modal */
  .overlay{ position:fixed; inset:0; background:rgba(36,31,26,0.5); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .overlay.active{ display:flex; }
  .modal{ background:var(--card); border-radius:14px; padding:20px; width:100%; max-width:400px; max-height:82vh; overflow-y:auto; box-shadow:0 10px 30px rgba(0,0,0,0.3); }
  .modal h3{ margin-bottom:14px; font-size:18px; }
  .modal input[type=text]{ width:100%; padding:11px; border:1px solid var(--line); border-radius:8px; margin-bottom:12px; background:#fff; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:14px; }
  .btn{ padding:10px 16px; border-radius:8px; font-weight:700; font-size:14px; }
  .btn-primary{ background:var(--navy); color:#fff; }
  .btn-ghost{ color:var(--ink-soft); }
  .btn-danger{ background:var(--danger); color:#fff; }
  .link-pick-item{
    padding:10px 12px; border-radius:8px; border:1px solid var(--line); margin-bottom:8px; display:flex; align-items:center; gap:10px; font-size:14px;
  }
  .link-pick-item .lp-badge{ font-size:10px; font-weight:700; color:#fff; padding:2px 7px; border-radius:8px; }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="masthead">
      <h1>📚 Ansiklopedim</h1>
      <div class="sub" id="entry-count-label">0 madde</div>
      <button class="save-btn" id="manual-save-btn" onclick="manualSave()">💾 Kaydet</button>
    </div>
    <div class="search-bar"><input type="text" id="search-input" placeholder="Maddelerde ara..." oninput="renderHome()"></div>
    <div class="chips" id="filter-chips"></div>
    <div class="facet-filters" id="facet-filters" style="display:none;"></div>
    <div class="toolbar-row">
      <div class="sort-group">
        <button class="pill-btn small" id="sort-date-btn" onclick="setSortMode('date')">🕒 Tarihe Göre</button>
        <button class="pill-btn small" id="sort-alpha-btn" onclick="setSortMode('alpha')">🔤 Alfabetik</button>
      </div>
      <button class="pill-btn small" onclick="openGraphScreen()">🕸️ İlişki Haritası</button>
    </div>
    <div class="entry-grid" id="entry-grid"></div>
    <div class="backup-row">
      <button class="pill-btn small" onclick="exportBackup()">⬇️ Yedek Al</button>
      <button class="pill-btn small" onclick="document.getElementById('import-input').click()">⬆️ Yedeği Geri Yükle</button>
      <input type="file" id="import-input" accept="application/json" style="display:none" onchange="importBackup(event)">
    </div>
  </div>

  <!-- RELATIONSHIP MAP -->
  <div class="screen" id="screen-graph">
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">←</button>
      <h2>🕸️ İlişki Haritası</h2>
      <span style="width:36px;"></span>
    </div>
    <div id="graph-wrap" style="padding:14px;"></div>
  </div>

  <!-- NEW ENTRY: pick category -->
  <div class="screen" id="screen-newentry">
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">←</button>
      <h2>Yeni Madde · Kategori Seç</h2>
    </div>
    <div class="cat-picker" id="cat-picker"></div>
  </div>

  <!-- NEW ENTRY: subfields + title -->
  <div class="screen" id="screen-newentry-details">
    <div class="topbar">
      <button class="back-btn" onclick="showScreen('screen-newentry')">←</button>
      <h2>Yeni Madde · Bilgiler</h2>
    </div>
    <div class="form-section">
      <div class="field">
        <label>Madde Başlığı</label>
        <input type="text" id="new-title-input" placeholder="Örn. Mimar Sinan">
      </div>
      <div id="new-subfields"></div>
      <button class="primary-btn" onclick="finalizeCreateEntry()">Oluştur ve Yazmaya Başla</button>
    </div>
  </div>

  <!-- ENTRY VIEW/EDIT -->
  <div class="screen" id="screen-entry">
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">←</button>
      <h2 style="flex:1;">Madde</h2>
      <button class="pill-btn" id="mode-toggle-btn" onclick="toggleEditMode()">Düzenle</button>
      <button class="pill-btn" style="color:var(--danger);" onclick="askDeleteEntry()">Sil</button>
    </div>

    <div class="cover-wrap" id="cover-wrap">
      <span id="cover-placeholder">Kapak resmi yok</span>
      <button class="cover-edit-btn" id="cover-edit-btn" style="display:none;" onclick="document.getElementById('cover-input').click()">🖼️ Kapak Resmi Değiştir</button>
      <input type="file" id="cover-input" accept="image/*" style="display:none" onchange="onCoverSelected(event)">
    </div>

    <div class="entry-header">
      <div class="cat-tag-row">
        <span class="cat-tag" id="entry-cat-tag"></span>
      </div>
      <div class="title-el" id="entry-title" style="font-size:28px;"></div>
    </div>

    <div class="title-style-row" id="title-style-row" style="display:none;">
      <select id="title-font" onchange="applyTitleStyle()">
        <option value="Georgia, serif">Klasik Serif</option>
        <option value="-apple-system, Segoe UI, Roboto, Arial, sans-serif">Modern Sans</option>
        <option value="'Palatino Linotype','Book Antiqua',serif">Zarif Serif</option>
        <option value="'Courier New', monospace">Daktilo</option>
        <option value="Verdana, sans-serif">Verdana</option>
      </select>
      <select id="title-size" onchange="applyTitleStyle()">
        <option value="22">Küçük</option>
        <option value="28" selected>Normal</option>
        <option value="34">Büyük</option>
        <option value="42">Çok Büyük</option>
      </select>
      <input type="color" id="title-color" value="#241F1A" onchange="applyTitleStyle()">
    </div>

    <div class="infobox" id="infobox"></div>

    <div class="toolbar" id="content-toolbar" style="display:none;">
      <select id="block-type" onchange="applyBlockType()">
        <option value="P">Paragraf</option>
        <option value="H2">Alt Başlık 1</option>
        <option value="H3">Alt Başlık 2</option>
      </select>
      <select id="body-font" onchange="applyBodyFont()">
        <option value="-apple-system, Segoe UI, Roboto, Arial, sans-serif">Modern</option>
        <option value="Georgia, serif">Klasik Serif</option>
        <option value="'Palatino Linotype','Book Antiqua',serif">Zarif</option>
        <option value="'Courier New', monospace">Daktilo</option>
        <option value="Verdana, sans-serif">Verdana</option>
      </select>
      <select id="body-size" onchange="applyBodySize()">
        <option value="2">Küçük</option>
        <option value="3" selected>Normal</option>
        <option value="5">Büyük</option>
        <option value="6">Çok Büyük</option>
      </select>
      <input type="color" id="body-color" value="#241F1A" onchange="applyBodyColor()" title="Yazı rengi">
      <button onclick="cmd('bold')"><b>K</b></button>
      <button onclick="cmd('italic')"><i>İ</i></button>
      <button onclick="cmd('underline')"><u>A</u></button>
      <button onclick="triggerBodyImageInsert()">🖼️ Resim</button>
      <button onclick="openLinkPicker()">🔗 Köprü</button>
      <input type="file" id="body-image-input" accept="image/*" style="display:none" onchange="insertBodyImage(event)">
    </div>

    <div class="content-body" id="content-body" data-placeholder="Maddeyi yazmaya başla..." oninput="onContentInput()"></div>
  </div>

</div>

<div class="img-float-toolbar" id="img-float-toolbar">
  <button onclick="setImgWidth(25)">Küçük</button>
  <button onclick="setImgWidth(50)">Orta</button>
  <button onclick="setImgWidth(75)">Büyük</button>
  <button onclick="setImgWidth(100)">Tam Genişlik</button>
  <button onclick="setImgAlign('left')">Sola</button>
  <button onclick="setImgAlign('center')">Ortala</button>
  <button onclick="setImgAlign('right')">Sağa</button>
  <button class="danger" onclick="deleteCurrentImage()">Sil</button>
  <button onclick="hideImgToolbar()">Kapat</button>
</div>

<!-- Link Picker Modal -->
<div class="overlay" id="modal-link-picker">
  <div class="modal">
    <h3>Hangi maddeye bağlansın?</h3>
    <input type="text" id="link-search" placeholder="Madde ara..." oninput="renderLinkPickerList()">
    <div id="link-pick-list"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-link-picker')">Vazgeç</button>
    </div>
  </div>
</div>

<!-- Confirm Delete Modal -->
<div class="overlay" id="modal-confirm">
  <div class="modal">
    <h3 id="confirm-text">Silinsin mi?</h3>
    <p style="color:var(--ink-soft);font-size:14px;margin-bottom:6px;">Bu işlem geri alınamaz.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-confirm')">Vazgeç</button>
      <button class="btn btn-danger" id="confirm-delete-btn">Sil</button>
    </div>
  </div>
</div>

<button class="fab" id="home-fab" onclick="showScreen('screen-newentry')">+</button>

<script>
/* ================= Kategori Tanımları ================= */
const categories = [
  { id:'kisi', label:'Kişi', icon:'👤', color:'#4A5D8A', fields:[
      { key:'cinsiyet', label:'Cinsiyet', type:'select', options:['Erkek','Kadın','Diğer'] },
      { key:'milliyet', label:'Milliyet', type:'text' },
      { key:'meslek', label:'Meslek', type:'text' },
      { key:'dogum', label:'Doğum Tarihi', type:'text' },
      { key:'dogumyeri', label:'Doğum Yeri', type:'text' }
  ]},
  { id:'mekan', label:'Mekan', icon:'🏙️', color:'#2E7D6B', fields:[
      { key:'tur', label:'Tür', type:'select', options:['Şehir','Ülke','Kıta','Bina','Doğal Alan','Diğer'] },
      { key:'ulke', label:'Ülke', type:'text' },
      { key:'nufus', label:'Nüfus', type:'text' }
  ]},
  { id:'tarihi_olay', label:'Tarihi Olay', icon:'📜', color:'#8A4A3D', fields:[
      { key:'tarih', label:'Tarih', type:'text' },
      { key:'yer', label:'Yer', type:'text' },
      { key:'olayturu', label:'Olay Türü', type:'select', options:['Savaş','Anlaşma','Devrim','Keşif','Kuruluş','Diğer'] }
  ]},
  { id:'yemek', label:'Yemek', icon:'🍽️', color:'#B5651D', fields:[
      { key:'koken', label:'Köken/Mutfak', type:'text' },
      { key:'tur', label:'Tür', type:'select', options:['Ana Yemek','Çorba','Tatlı','Meze','İçecek','Diğer'] },
      { key:'malzeme', label:'Ana Malzemeler', type:'text' }
  ]},
  { id:'hayvan', label:'Hayvan', icon:'🐾', color:'#5B7A3A', fields:[
      { key:'sinif', label:'Sınıf', type:'select', options:['Memeli','Kuş','Sürüngen','Balık','Böcek','Diğer'] },
      { key:'yasamalani', label:'Yaşam Alanı', type:'text' },
      { key:'beslenme', label:'Beslenme', type:'select', options:['Etçil','Otçul','Hepçil'] }
  ]},
  { id:'bitki', label:'Bitki', icon:'🌿', color:'#3F8F5C', fields:[
      { key:'tur', label:'Tür', type:'select', options:['Ağaç','Çiçek','Sebze','Meyve','Diğer'] },
      { key:'iklim', label:'İklim', type:'text' }
  ]},
  { id:'eser', label:'Eser', icon:'🎬', color:'#7A4A8A', fields:[
      { key:'tur', label:'Tür', type:'select', options:['Kitap','Film','Dizi','Müzik','Resim','Heykel','Diğer'] },
      { key:'yaratici', label:'Yaratıcı/Yazar', type:'text' },
      { key:'yil', label:'Yıl', type:'text' }
  ]},
  { id:'bilim', label:'Bilim & Kavram', icon:'🔬', color:'#2F5F8A', fields:[
      { key:'alan', label:'Alan', type:'select', options:['Fizik','Kimya','Biyoloji','Matematik','Felsefe','Diğer'] }
  ]},

function getCat(id){ return categories.find(c=>c.id===id); }

/* ================= Veri =================
   Her madde kendi anahtarıyla ayrı ayrı kaydedilir (ansiklopedim_entry_<id>).
   Bu sayede bir maddeyi kaydetmek başka bir maddenin verisinin üzerine yazamaz. */
const LEGACY_KEY = 'ansiklopedim_v1';
const ENTRY_PREFIX = 'ansiklopedim_entry_';
const CUSTOM_OPT_KEY = 'ansiklopedim_customoptions_v1';
let data = { entries: [], customOptions: {} };
let currentEntryId = null;
let editMode = false;
let pendingCategoryId = null;
let currentImgEl = null;
let activeFilter = 'all';
let activeFacetFilters = {}; // { fieldKey: Set(values) }
let sortMode = 'date'; // 'date' | 'alpha'
let saveTimers = {};

function loadData(){
  data.entries = [];
  try{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){ keys.push(localStorage.key(i)); }
    keys.forEach(k=>{
      if(k && k.indexOf(ENTRY_PREFIX)===0){
        try{
          const e = JSON.parse(localStorage.getItem(k));
          if(e && e.id) data.entries.push(e);
        }catch(err){}
      }
    });
  }catch(e){}
  try{
    const co = localStorage.getItem(CUSTOM_OPT_KEY);
    data.customOptions = co ? JSON.parse(co) : {};
  }catch(e){ data.customOptions = {}; }
  // Eski (v1) tek-blok formatından geçiş: yeni formatta hiç madde yoksa eski veriyi taşı
  if(data.entries.length === 0){
    try{
      const legacyRaw = localStorage.getItem(LEGACY_KEY);
      if(legacyRaw){
        const legacy = JSON.parse(legacyRaw);
        if(legacy && Array.isArray(legacy.entries) && legacy.entries.length){
          legacy.entries.forEach(e=>{ persistEntry(e); data.entries.push(e); });
          if(legacy.customOptions){ data.customOptions = legacy.customOptions; persistCustomOptions(); }
        }
      }
    }catch(e){}
  }
}
function persistEntry(entry){
  try{ localStorage.setItem(ENTRY_PREFIX + entry.id, JSON.stringify(entry)); return true; }
  catch(e){ console.error('Kaydedilemedi', e); return false; }
}
function deleteEntryStorage(id){
  try{ localStorage.removeItem(ENTRY_PREFIX + id); }catch(e){}
}
function persistCustomOptions(){
  try{ localStorage.setItem(CUSTOM_OPT_KEY, JSON.stringify(data.customOptions||{})); }catch(e){}
}
function manualSave(){
  let allOk = true;
  data.entries.forEach(entry=>{ if(!persistEntry(entry)) allOk = false; });
  persistCustomOptions();
  const btn = document.getElementById('manual-save-btn');
  if(allOk){
    btn.textContent = '✓ Kaydedildi';
    btn.classList.add('saved');
  }else{
    btn.textContent = '⚠️ Hata';
  }
  setTimeout(()=>{ btn.textContent = '💾 Kaydet'; btn.classList.remove('saved'); }, 1500);
}
function debouncedSaveEntry(entry){
  clearTimeout(saveTimers[entry.id]);
  saveTimers[entry.id] = setTimeout(()=>persistEntry(entry), 400);
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str||''; return d.innerHTML; }

/* ================= Ekran Geçişleri ================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');

/* ================= Ana Sayfa ================= */
function renderFilterChips(){
  const wrap = document.getElementById('filter-chips');
  wrap.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (activeFilter==='all' ? ' active' : '');
  allChip.textContent = 'Tümü';
  allChip.onclick = ()=>{ activeFilter='all'; activeFacetFilters={}; renderHome(); };
  wrap.appendChild(allChip);
  categories.forEach(c=>{
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeFilter===c.id ? ' active' : '');
    chip.textContent = c.icon + ' ' + c.label;
    chip.onclick = ()=>{ activeFilter=c.id; activeFacetFilters={}; renderHome(); };
    wrap.appendChild(chip);
  });
}
function renderFacetFilters(){
  const wrap = document.getElementById('facet-filters');
  wrap.innerHTML = '';
  if(activeFilter==='all'){ wrap.style.display='none'; return; }
  const cat = getCat(activeFilter);
  const entries = data.entries.filter(e=>e.category===activeFilter);
  let any = false;
  cat.fields.forEach(f=>{
    const values = Array.from(new Set(entries.map(e=>e.subfields[f.key]).filter(v=>v))).sort((a,b)=>a.localeCompare(b,'tr'));
    if(values.length===0) return;
    any = true;
    const group = document.createElement('div');
    group.className = 'facet-group';
    const title = document.createElement('div');
    title.className = 'facet-title';
    title.textContent = f.label;
    group.appendChild(title);
    const optsWrap = document.createElement('div');
    optsWrap.className = 'facet-options';
    values.forEach(v=>{
      const label = document.createElement('label');
      label.className = 'facet-check';
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = !!(activeFacetFilters[f.key] && activeFacetFilters[f.key].has(v));
      box.onchange = ()=>toggleFacet(f.key, v, box.checked);
      label.appendChild(box);
      label.appendChild(document.createTextNode(' ' + v));
      optsWrap.appendChild(label);
    });
    group.appendChild(optsWrap);
    wrap.appendChild(group);
  });
  if(!any){
    const p = document.createElement('p');
    p.style.cssText = 'font-size:12px;color:var(--ink-soft);padding:6px 0 0;margin:0;';
    p.textContent = 'Bu kategoride henüz filtrelenebilir bilgi yok.';
    wrap.appendChild(p);
  }
  wrap.style.display = 'block';
}
function toggleFacet(key, value, checked){
  if(!activeFacetFilters[key]) activeFacetFilters[key] = new Set();
  if(checked) activeFacetFilters[key].add(value); else activeFacetFilters[key].delete(value);
  renderHome();
}
function setSortMode(mode){ sortMode = mode; renderHome(); }
function renderHome(){
  renderFilterChips();
  renderFacetFilters();
  document.getElementById('sort-date-btn').classList.toggle('active', sortMode==='date');
  document.getElementById('sort-alpha-btn').classList.toggle('active', sortMode==='alpha');

  const q = (document.getElementById('search-input').value||'').toLocaleLowerCase('tr');
  let list = data.entries.slice();
  if(activeFilter!=='all') list = list.filter(e=>e.category===activeFilter);
  Object.keys(activeFacetFilters).forEach(key=>{
    const valSet = activeFacetFilters[key];
    if(valSet.size>0) list = list.filter(e=> valSet.has(e.subfields[key]));
  });
  if(q) list = list.filter(e=>e.title.toLocaleLowerCase('tr').includes(q));

  if(sortMode==='alpha') list.sort((a,b)=>a.title.localeCompare(b.title,'tr'));
  else list.sort((a,b)=>b.createdAt-a.createdAt);

  document.getElementById('entry-count-label').textContent = data.entries.length + ' madde';

  const grid = document.getElementById('entry-grid');
  grid.innerHTML = '';
  if(list.length===0){
    grid.style.display='block';
    grid.innerHTML = `<div class="empty-state"><div class="big">📖</div><div>${data.entries.length===0 ? 'Henüz madde yok. Sağ alttaki + tuşuyla ilkini ekle.' : 'Sonuç bulunamadı.'}</div></div>`;
    return;
  }
  grid.style.display='grid';
  list.forEach(entry=>{
    const cat = getCat(entry.category);
    const card = document.createElement('div');
    card.className = 'entry-card';
    const thumbStyle = entry.coverImage ? `background-image:url('${entry.coverImage}')` : `background:${cat.color}`;
    card.innerHTML = `
      <div class="thumb" style="${thumbStyle}">${entry.coverImage ? '' : cat.icon}</div>
      <div class="info">
        <span class="cat-badge" style="background:${cat.color}">${cat.icon} ${cat.label}</span>
        <div class="etitle">${escapeHtml(entry.title)}</div>
      </div>`;
    card.onclick = ()=>openEntry(entry.id);
    grid.appendChild(card);
  });
}

/* ================= Yeni Madde Oluşturma ================= */
function renderCatPicker(){
  const wrap = document.getElementById('cat-picker');
  wrap.innerHTML = '';
  categories.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.innerHTML = `<div class="ic">${c.icon}</div><div>${c.label}</div>`;
    btn.onclick = ()=>{ pendingCategoryId = c.id; goToDetailsForm(); };
    wrap.appendChild(btn);
  });
}
function getFieldOptions(catId, fieldKey, baseOptions){
  const extra = (data.customOptions && data.customOptions[catId] && data.customOptions[catId][fieldKey]) || [];
  const all = baseOptions.concat(extra.filter(v=>!baseOptions.includes(v)));
  return all;
}
function addCustomOption(catId, fieldKey, value){
  if(!data.customOptions) data.customOptions = {};
  if(!data.customOptions[catId]) data.customOptions[catId] = {};
  if(!data.customOptions[catId][fieldKey]) data.customOptions[catId][fieldKey] = [];
  if(!data.customOptions[catId][fieldKey].includes(value)) data.customOptions[catId][fieldKey].push(value);
  persistCustomOptions();
}
function buildSelectOptionsHtml(catId, fieldKey, baseOptions, selectedValue){
  const opts = getFieldOptions(catId, fieldKey, baseOptions);
  let html = `<option value="">Seç...</option>`;
  opts.forEach(o=>{ html += `<option value="${escapeHtml(o)}" ${o===selectedValue?'selected':''}>${escapeHtml(o)}</option>`; });
  html += `<option value="__new__">+ Yeni Ekle...</option>`;
  return html;
}
function handleAddOptionChange(selectEl, catId, fieldKey, onRealValue){
  if(selectEl.value === '__new__'){
    const cat = getCat(catId);
    const f = cat.fields.find(x=>x.key===fieldKey);
    const val = prompt(`"${f.label}" için yeni bir değer gir:`);
    if(val && val.trim()){
      addCustomOption(catId, fieldKey, val.trim());
      selectEl.innerHTML = buildSelectOptionsHtml(catId, fieldKey, f.options, val.trim());
      if(onRealValue) onRealValue(val.trim());
    }else{
      selectEl.value = '';
      if(onRealValue) onRealValue('');
    }
  }else{
    if(onRealValue) onRealValue(selectEl.value);
  }
}
function goToDetailsForm(){
  const cat = getCat(pendingCategoryId);
  document.getElementById('new-title-input').value = '';
  const fieldsWrap = document.getElementById('new-subfields');
  fieldsWrap.innerHTML = '';
  cat.fields.forEach(f=>{
    const div = document.createElement('div');
    div.className = 'field';
    if(f.type==='select'){
      const label = document.createElement('label'); label.textContent = f.label;
      const sel = document.createElement('select'); sel.id = 'nf_'+f.key;
      sel.innerHTML = buildSelectOptionsHtml(pendingCategoryId, f.key, f.options, '');
      sel.onchange = ()=>handleAddOptionChange(sel, pendingCategoryId, f.key, null);
      div.appendChild(label); div.appendChild(sel);
    }else{
      div.innerHTML = `<label>${f.label}</label><input type="text" id="nf_${f.key}" placeholder="${f.label}">`;
    }
    fieldsWrap.appendChild(div);
  });
  showScreen('screen-newentry-details');
}
function finalizeCreateEntry(){
  const title = document.getElementById('new-title-input').value.trim();
  if(!title){ alert('Lütfen bir başlık gir.'); return; }
  const cat = getCat(pendingCategoryId);
  const subfields = {};
  cat.fields.forEach(f=>{
    const el = document.getElementById('nf_'+f.key);
    subfields[f.key] = (el.value === '__new__') ? '' : (el.value || '');
  });
  const entry = {
    id: uid(), title, category: pendingCategoryId, subfields,
    coverImage: null, content: '',
    titleStyle: { font:'Georgia, serif', size:28, color:'#241F1A' },
    createdAt: Date.now(), updatedAt: Date.now()
  };
  data.entries.push(entry);
  persistEntry(entry);
  openEntry(entry.id, true);
}

/* ================= Madde Görüntüleme / Düzenleme ================= */
function getCurrentEntry(){ return data.entries.find(e=>e.id===currentEntryId); }

function openEntry(id, startEdit){
  const entry = data.entries.find(e=>e.id===id);
  if(!entry){ alert('Bu madde bulunamadı (silinmiş olabilir).'); return; }
  currentEntryId = id;
  editMode = !!startEdit;
  renderEntryScreen();
  showScreen('screen-entry');
}
function toggleEditMode(){
  editMode = !editMode;
  renderEntryScreen();
}
function renderEntryScreen(){
  const entry = getCurrentEntry();
  const cat = getCat(entry.category);

  document.getElementById('mode-toggle-btn').textContent = editMode ? 'Bitti (Oku)' : 'Düzenle';
  document.getElementById('mode-toggle-btn').classList.toggle('active', editMode);

  // Kapak
  const coverWrap = document.getElementById('cover-wrap');
  const coverPlaceholder = document.getElementById('cover-placeholder');
  const coverEditBtn = document.getElementById('cover-edit-btn');
  if(entry.coverImage){
    coverWrap.style.backgroundImage = `url('${entry.coverImage}')`;
    coverPlaceholder.style.display = 'none';
  }else{
    coverWrap.style.backgroundImage = 'none';
    coverPlaceholder.style.display = editMode ? 'none' : 'block';
  }
  coverEditBtn.style.display = editMode ? 'block' : 'none';
  coverWrap.style.display = (entry.coverImage || editMode) ? 'flex' : 'none';

  // Kategori etiketi
  const tag = document.getElementById('entry-cat-tag');
  tag.textContent = cat.icon + ' ' + cat.label;
  tag.style.background = cat.color;

  // Başlık
  const titleEl = document.getElementById('entry-title');
  titleEl.textContent = entry.title;
  titleEl.contentEditable = editMode;
  titleEl.style.fontFamily = entry.titleStyle.font;
  titleEl.style.fontSize = entry.titleStyle.size + 'px';
  titleEl.style.color = entry.titleStyle.color;
  titleEl.oninput = ()=>{ entry.title = titleEl.textContent; entry.updatedAt = Date.now(); debouncedSaveEntry(entry); };

  document.getElementById('title-style-row').style.display = editMode ? 'flex' : 'none';
  document.getElementById('title-font').value = entry.titleStyle.font;
  document.getElementById('title-size').value = String(entry.titleStyle.size);
  document.getElementById('title-color').value = entry.titleStyle.color;

  // Bilgi kutusu
  renderInfobox(entry, cat);

  // Araç çubuğu
  document.getElementById('content-toolbar').style.display = editMode ? 'flex' : 'none';

  // İçerik
  const body = document.getElementById('content-body');
  body.innerHTML = entry.content || '';
  body.contentEditable = editMode;
  markBrokenLinks(body);
}
function renderInfobox(entry, cat){
  const box = document.getElementById('infobox');
  box.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'infobox-head';
  head.textContent = `${cat.icon} ${cat.label} Bilgileri`;
  box.appendChild(head);
  cat.fields.forEach(f=>{
    const val = entry.subfields[f.key] || '';
    const row = document.createElement('div');
    row.className = 'infobox-row';
    const k = document.createElement('div'); k.className='k'; k.textContent = f.label;
    const v = document.createElement('div'); v.className='v';
    if(editMode){
      if(f.type==='select'){
        const sel = document.createElement('select');
        sel.innerHTML = buildSelectOptionsHtml(cat.id, f.key, f.options, val);
        sel.onchange = ()=>handleAddOptionChange(sel, cat.id, f.key, (realVal)=>updateSubfield(f.key, realVal));
        v.appendChild(sel);
      }else{
        const inp = document.createElement('input');
        inp.type = 'text'; inp.value = val;
        inp.oninput = ()=>updateSubfield(f.key, inp.value);
        v.appendChild(inp);
      }
    }else{
      v.innerHTML = val ? escapeHtml(val) : '<span style="color:var(--ink-soft);">—</span>';
    }
    row.appendChild(k); row.appendChild(v);
    box.appendChild(row);
  });
}
function updateSubfield(key, value){
  const entry = getCurrentEntry();
  entry.subfields[key] = value;
  entry.updatedAt = Date.now();
  debouncedSaveEntry(entry);
}
function onCoverSelected(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const entry = getCurrentEntry();
    entry.coverImage = e.target.result;
    entry.updatedAt = Date.now();
    persistEntry(entry);
    renderEntryScreen();
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}
function applyTitleStyle(){
  const entry = getCurrentEntry();
  entry.titleStyle = {
    font: document.getElementById('title-font').value,
    size: parseInt(document.getElementById('title-size').value, 10),
    color: document.getElementById('title-color').value
  };
  entry.updatedAt = Date.now();
  const titleEl = document.getElementById('entry-title');
  titleEl.style.fontFamily = entry.titleStyle.font;
  titleEl.style.fontSize = entry.titleStyle.size + 'px';
  titleEl.style.color = entry.titleStyle.color;
  debouncedSaveEntry(entry);
}

function onContentInput(){

function cmd(command, val){

function applyBlockType(){ cmd('formatBlock', document.getElementById('block-type').value); }

/* Resim ekleme (içerik içine) */
function triggerBodyImageInsert(){ document.getElementById('body-image-input').click(); }
function insertBodyImage(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const body = document.getElementById('content-body');
    body.focus();
    const sel = window.getSelection();
    let range;
    if(sel.rangeCount && body.contains(sel.anchorNode)){
      range = sel.getRangeAt(0);
    }else{
      range = document.createRange();
      range.selectNodeContents(body);
      range.collapse(false);
    }
    const img = document.createElement('img');
    img.src = e.target.result;
    img.className = 'body-img';
    img.style.width = '50%';
    img.style.display = 'block';
    img.style.margin = '10px auto';
    range.deleteContents();
    range.insertNode(img);
    range.setStartAfter(img);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
    onContentInput();
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

/* Resme dokununca boyut/hizalama araç çubuğu */

}
function setImgWidth(pct){

/* ================= Köprü (Wiki-Link) ================= */
let savedLinkRange = null;
function openLinkPicker(){
  const sel = window.getSelection();
  if(!sel.rangeCount || sel.isCollapsed){
    alert('Önce köprü yapmak istediğin kelimeyi/kelimeleri seç.');
    return;
  }
  savedLinkRange = sel.getRangeAt(0).cloneRange();
  document.getElementById('link-search').value = '';
  renderLinkPickerList();
  document.getElementById('modal-link-picker').classList.add('active');
}
function renderLinkPickerList(){
  const q = (document.getElementById('link-search').value||'').toLocaleLowerCase('tr');
  const list = data.entries.filter(e=>e.id!==currentEntryId && (!q || e.title.toLocaleLowerCase('tr').includes(q)));
  const wrap = document.getElementById('link-pick-list');
  wrap.innerHTML = '';
  if(list.length===0){
    wrap.innerHTML = '<p style="color:var(--ink-soft);font-size:14px;">Eşleşen madde yok.</p>';
    return;
  }
  list.forEach(e=>{
    const cat = getCat(e.category);
    const item = document.createElement('div');
    item.className = 'link-pick-item';
    item.innerHTML = `<span class="lp-badge" style="background:${cat.color}">${cat.icon}</span><span>${escapeHtml(e.title)}</span>`;
    item.onclick = ()=>confirmLink(e.id);
    wrap.appendChild(item);
  });
}
function confirmLink(targetId){
  if(!savedLinkRange) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(savedLinkRange);
  const text = sel.toString();
  const a = document.createElement('a');
  a.className = 'wiki-link';
  a.href = '#';
  a.dataset.target = targetId;
  a.textContent = text;
  savedLinkRange.deleteContents();
  savedLinkRange.insertNode(a);
  sel.removeAllRanges();
  closeModal('modal-link-picker');
  onContentInput();
  markBrokenLinks(document.getElementById('content-body'));
}
function markBrokenLinks(container){
  container.querySelectorAll('.wiki-link').forEach(a=>{
    const exists = data.entries.some(e=>e.id===a.dataset.target);
    a.classList.toggle('broken', !exists);
  });
}

/* ================= Silme ================= */
function askDeleteEntry(){
  const entry = getCurrentEntry();
  document.getElementById('confirm-text').textContent = `"${entry.title}" silinsin mi?`;

    data.entries = data.entries.filter(e=>e.id!==entry.id);

}

/* ================= Yedekleme (Dışa/İçe Aktarma) ================= */
function exportBackup(){
  const backup = { entries: data.entries, customOptions: data.customOptions || {}, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `ansiklopedim-yedek-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const backup = JSON.parse(e.target.result);
      if(!backup || !Array.isArray(backup.entries)) throw new Error('Geçersiz yedek dosyası');
      let added = 0, updated = 0;
      backup.entries.forEach(entry=>{
        if(!entry || !entry.id) return;
        const exists = data.entries.some(x=>x.id===entry.id);
        persistEntry(entry);
        if(exists) updated++; else added++;
      });
      if(backup.customOptions){
        data.customOptions = data.customOptions || {};
        Object.keys(backup.customOptions).forEach(catId=>{
          data.customOptions[catId] = data.customOptions[catId] || {};
          Object.keys(backup.customOptions[catId]).forEach(fieldKey=>{
            const existingArr = data.customOptions[catId][fieldKey] || [];
            const incoming = backup.customOptions[catId][fieldKey] || [];
            data.customOptions[catId][fieldKey] = Array.from(new Set(existingArr.concat(incoming)));
          });
        });
        persistCustomOptions();
      }
      loadData();
      renderHome();
      alert(`Yedek yüklendi: ${added} yeni madde eklendi, ${updated} madde güncellendi.`);
    }catch(err){
      alert('Yedek dosyası okunamadı. Doğru dosyayı seçtiğinden emin ol.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ================= İlişki Haritası ================= */
function openGraphScreen(){
  renderGraph();
  showScreen('screen-graph');
}
function renderGraph(){
  const wrap = document.getElementById('graph-wrap');
  const entries = data.entries;
  if(entries.length===0){
    wrap.innerHTML = '<div class="empty-state"><div class="big">🕸️</div><div>Henüz madde yok.</div></div>';
    return;
  }
  // Bağlantıları (köprüleri) topla
  const links = [];
  entries.forEach(e=>{
    const div = document.createElement('div');
    div.innerHTML = e.content || '';
    div.querySelectorAll('.wiki-link').forEach(a=>{
      const targetId = a.dataset.target;
      if(entries.some(x=>x.id===targetId)){
        links.push({ from: e.id, to: targetId });
      }
    });
  });
  if(links.length===0){
    wrap.innerHTML = '<div class="empty-state"><div class="big">🔗</div><div>Henüz madde arasında köprü kurulmamış. Bir maddeyi düzenlerken "🔗 Köprü" ile başka bir maddeye bağlayabilirsin.</div></div>';
    return;
  }
  // Bağlantısı olan maddeleri daireye yerleştir
  const connectedIds = Array.from(new Set(links.flatMap(l=>[l.from,l.to])));
  const nodes = connectedIds.map(id=>entries.find(e=>e.id===id)).filter(Boolean);
  const size = 320;
  const cx = size/2, cy = size/2, r = size/2 - 46;
  const pos = {};
  nodes.forEach((n,i)=>{
    const angle = (i / nodes.length) * Math.PI * 2 - Math.PI/2;
    pos[n.id] = { x: cx + r*Math.cos(angle), y: cy + r*Math.sin(angle) };
  });
  let svg = `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size}px;display:block;margin:0 auto;">`;
  links.forEach(l=>{
    const a = pos[l.from], b = pos[l.to];
    if(a && b){
      svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#C9BFA0" stroke-width="2" />`;
    }
  });
  nodes.forEach(n=>{
    const cat = getCat(n.category);
    const p = pos[n.id];
    svg += `<g class="graph-node" data-id="${n.id}" style="cursor:pointer;">
      <circle cx="${p.x}" cy="${p.y}" r="24" fill="${cat.color}" stroke="#fff" stroke-width="2" />
      <text x="${p.x}" y="${p.y+5}" text-anchor="middle" font-size="16" fill="#fff">${cat.icon}</text>
    </g>`;
  });
  svg += `</svg>`;
  wrap.innerHTML = svg;
  wrap.querySelectorAll('.graph-node').forEach(g=>{
    g.addEventListener('click', ()=>openEntry(g.dataset.id, false));
  });
  const legend = document.createElement('div');
  legend.style.cssText = 'padding:14px 4px;text-align:center;font-size:13px;color:var(--ink-soft);';
  legend.textContent = 'Bir daireye dokunarak o maddeyi açabilirsin.';
  wrap.appendChild(legend);
  const list = document.createElement('div');
  list.style.cssText = 'padding:6px 4px 20px;';
  nodes.forEach(n=>{
    const cat = getCat(n.category);
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:13px;';
    row.innerHTML = `<span style="width:10px;height:10px;border-radius:50%;background:${cat.color};display:inline-block;"></span> ${escapeHtml(n.title)}`;
    list.appendChild(row);
  });
  wrap.appendChild(list);
}
